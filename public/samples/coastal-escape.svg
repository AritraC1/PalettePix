<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#72bfe8"/>
      <stop offset="65%" stop-color="#bce3f5"/>
      <stop offset="100%" stop-color="#dff2fb"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D8E9D"/>
      <stop offset="40%" stop-color="#147b8d"/>
      <stop offset="100%" stop-color="#17435B"/>
    </linearGradient>
    <linearGradient id="shallowGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7BC6C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1D8E9D" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="cliffGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97B51"/>
      <stop offset="50%" stop-color="#9A583A"/>
      <stop offset="100%" stop-color="#6b3720"/>
    </linearGradient>
    <linearGradient id="cliffGrad2" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E7CA9E"/>
      <stop offset="60%" stop-color="#C97B51"/>
      <stop offset="100%" stop-color="#5a2f1c"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="320" fill="url(#skyGrad)"/>

  <!-- Distant Headlands -->
  <path d="M480,270 Q580,240 680,265 T800,275 L800,340 L480,340 Z" fill="#6ba7b8" opacity="0.45"/>
  <path d="M560,285 Q650,268 740,280 T800,285 L800,340 L560,340 Z" fill="#4d8b9e" opacity="0.5"/>

  <!-- Sea -->
  <rect y="295" width="800" height="205" fill="url(#seaGrad)"/>
  
  <!-- Shallow turquoise water around coves -->
  <path d="M120,440 C220,410 320,380 440,390 C490,395 560,370 540,340 C420,330 280,350 160,375 Z" fill="url(#shallowGrad)"/>
  <ellipse cx="280" cy="410" rx="140" ry="35" fill="#7BC6C7" opacity="0.6" filter="blur(8px)"/>

  <!-- Main Cliff formations -->
  <path d="M0,180 Q80,160 140,210 T250,230 Q310,210 340,270 T380,350 Q360,400 320,440 L280,450 L0,500 Z" fill="url(#cliffGrad1)"/>
  <path d="M110,210 L190,190 L260,250 L280,330 L220,390 L130,350 Z" fill="url(#cliffGrad2)" opacity="0.85"/>
  
  <!-- Coastal Village Terracotta and Pastel Houses -->
  <!-- House Clusters -->
  <rect x="90" y="220" width="28" height="36" rx="2" fill="#E7CA9E"/>
  <polygon points="88,220 104,206 120,220" fill="#9A583A"/>
  
  <rect x="122" y="210" width="32" height="42" rx="2" fill="#f4d8b5"/>
  <polygon points="120,210 138,194 156,210" fill="#C97B51"/>

  <rect x="156" y="225" width="26" height="35" rx="2" fill="#e89f78"/>
  <polygon points="154,225 169,212 184,225" fill="#9A583A"/>

  <rect x="110" y="248" width="30" height="38" rx="2" fill="#fce4c8"/>
  <polygon points="108,248 125,234 142,248" fill="#C97B51"/>

  <rect x="144" y="255" width="34" height="40" rx="2" fill="#deb485"/>
  <polygon points="142,255 161,240 180,255" fill="#874728"/>

  <rect x="75" y="245" width="30" height="34" rx="2" fill="#f7cfaf"/>
  <polygon points="73,245 90,232 107,245" fill="#a45832"/>

  <!-- Tiny windows and details -->
  <rect x="96" y="228" width="5" height="7" fill="#17435B" opacity="0.7"/>
  <rect x="108" y="228" width="5" height="7" fill="#17435B" opacity="0.7"/>
  <rect x="130" y="220" width="6" height="8" fill="#17435B" opacity="0.7"/>
  <rect x="142" y="220" width="6" height="8" fill="#17435B" opacity="0.7"/>
  <rect x="118" y="258" width="6" height="8" fill="#17435B" opacity="0.7"/>
  <rect x="130" y="258" width="6" height="8" fill="#17435B" opacity="0.7"/>
  <rect x="152" y="266" width="6" height="8" fill="#17435B" opacity="0.7"/>

  <!-- Mediterranean Green Shrubs on Rocks -->
  <circle cx="65" cy="285" r="14" fill="#2d5e38"/>
  <circle cx="85" cy="290" r="18" fill="#3a7546"/>
  <circle cx="105" cy="300" r="16" fill="#254e2f"/>
  <circle cx="185" cy="275" r="15" fill="#3a7546"/>
  <circle cx="210" cy="290" r="22" fill="#2d5e38"/>
  <circle cx="235" cy="320" r="26" fill="#254e2f"/>
  <circle cx="255" cy="355" r="24" fill="#3a7546"/>
  <circle cx="285" cy="390" r="22" fill="#254e2f"/>

  <!-- Rocks at waterline -->
  <path d="M260,420 Q310,390 350,425 T420,440 L400,470 L250,480 Z" fill="#6b3720" opacity="0.9"/>
  <path d="M330,410 Q370,400 400,425 L380,450 Z" fill="#9A583A"/>

  <!-- Gentle water foam / waves -->
  <path d="M230,435 Q290,415 360,430 T460,442" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M280,450 Q340,435 410,448" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.5"/>
</svg>

