<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4EC"/>
      <stop offset="50%" stop-color="#D2E5CE"/>
      <stop offset="100%" stop-color="#c4ddbf"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#85B978"/>
      <stop offset="45%" stop-color="#457C47"/>
      <stop offset="100%" stop-color="#26522D"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#a0ce92"/>
      <stop offset="50%" stop-color="#457C47"/>
      <stop offset="100%" stop-color="#1B3B22"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26522D"/>
      <stop offset="70%" stop-color="#1B3B22"/>
      <stop offset="100%" stop-color="#132617"/>
    </linearGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="18" flood-color="#132617" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#bgWall)"/>

  <!-- Soft Sunlight wash -->
  <circle cx="650" cy="100" r="320" fill="#ffffff" opacity="0.3" filter="blur(40px)"/>

  <!-- Background Leaves (Shadowed) -->
  <g opacity="0.45" filter="blur(3px)">
    <path d="M-50,220 C40,120 180,100 240,240 C280,340 180,480 30,470 Z" fill="url(#leafDark)"/>
    <path d="M600,480 C540,320 620,180 780,210 C860,230 890,420 740,510 Z" fill="url(#leafDark)"/>
  </g>

  <!-- Left Monstera Leaf -->
  <g filter="url(#leafShadow)">
    <path d="M-40,280 Q80,150 170,110 Q280,70 310,210 Q320,310 240,410 Q160,490 20,490 Q-70,480 -40,280 Z" fill="url(#leafGrad2)"/>
    <!-- Monstera slits / holes -->
    <ellipse cx="140" cy="180" rx="42" ry="14" fill="#D2E5CE" transform="rotate(-35 140 180)"/>
    <ellipse cx="195" cy="235" rx="50" ry="16" fill="#D2E5CE" transform="rotate(-20 195 235)"/>
    <ellipse cx="210" cy="315" rx="46" ry="15" fill="#D2E5CE" transform="rotate(10 210 315)"/>
    <ellipse cx="165" cy="385" rx="44" ry="15" fill="#D2E5CE" transform="rotate(35 165 385)"/>
    <!-- Stem and ribs -->
    <path d="M-10,340 Q130,280 270,180" stroke="#85B978" stroke-width="4.5" fill="none" opacity="0.7"/>
  </g>

  <!-- Center Giant Monstera Leaf (Hero) -->
  <g filter="url(#leafShadow)">
    <path d="M480,520 Q440,350 410,260 Q360,110 510,80 Q660,60 710,180 Q760,290 690,410 Q610,510 480,520 Z" fill="url(#leafGrad1)"/>
    <!-- Inner cutouts / Fenestrations -->
    <ellipse cx="490" cy="155" rx="48" ry="16" fill="#D2E5CE" transform="rotate(-50 490 155)"/>
    <ellipse cx="445" cy="225" rx="55" ry="18" fill="#D2E5CE" transform="rotate(-40 445 225)"/>
    <ellipse cx="440" cy="310" rx="58" ry="18" fill="#D2E5CE" transform="rotate(-15 440 310)"/>
    <ellipse cx="465" cy="390" rx="50" ry="16" fill="#D2E5CE" transform="rotate(15 465 390)"/>
    <ellipse cx="615" cy="160" rx="46" ry="16" fill="#D2E5CE" transform="rotate(40 615 160)"/>
    <ellipse cx="645" cy="245" rx="52" ry="17" fill="#D2E5CE" transform="rotate(25 645 245)"/>
    <ellipse cx="640" cy="335" rx="50" ry="16" fill="#D2E5CE" transform="rotate(-5 640 335)"/>
    
    <!-- Monstera Pinholes -->
    <ellipse cx="530" cy="250" rx="14" ry="6" fill="#D2E5CE" transform="rotate(-30 530 250)"/>
    <ellipse cx="560" cy="300" rx="16" ry="7" fill="#D2E5CE" transform="rotate(20 560 300)"/>

    <!-- Veins and details -->
    <path d="M490,490 Q520,330 570,120" stroke="#85B978" stroke-width="5" fill="none" opacity="0.6"/>
  </g>

  <!-- Bottom Left Small Leaf Accent -->
  <g filter="url(#leafShadow)">
    <path d="M120,530 Q220,440 280,390 Q340,340 380,410 Q400,480 320,540 Z" fill="url(#leafDark)"/>
    <ellipse cx="280" cy="420" rx="30" ry="10" fill="#D2E5CE" transform="rotate(-30 280 420)"/>
  </g>
</svg>

